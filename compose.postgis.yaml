services:
    postgis:
        image: postgis/postgis:18-3.7
        environment:
            POSTGRES_DB: disaster_ready_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: local-test-only
        ports:
            - '127.0.0.1:55432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d disaster_ready_test']
            interval: 5s
            timeout: 5s
            retries: 10
